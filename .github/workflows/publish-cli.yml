name: Publish CLI to npm

# Publishing is gated on a GitHub Release, never on a push to main: the release
# tag (v0.1.0, v0.2.0, …) is the version, so a commit cannot reach npm without
# a human deciding it should.
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for OIDC npm authentication. Granted so that the moment npm
      # OIDC is enabled on the package (Settings -> Trusted Publisher) this
      # workflow can authenticate with a short-lived identity and no long-lived
      # token at all; until then the NPM_TOKEN fallback below is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      # `npm ci` (not `npm install`) so a published tarball can never contain a
      # dependency tree the lockfile does not describe. The CLI is a separate
      # package with its own lockfile, hence the cd and the scoped cache path.
      - name: Install dependencies
        run: cd packages/cli && npm ci

      - name: Build CLI
        run: cd packages/cli && npm run build

      - name: Publish to npm
        run: cd packages/cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
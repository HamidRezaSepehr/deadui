name: Publish CLI to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: cd packages/cli && npm ci
      
      - name: Build CLI
        run: cd packages/cli && npm run build
      
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/cli
          
          echo "🔍 Checking if NPM_TOKEN is present..."
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ ERROR: NPM_TOKEN secret is empty or missing!"
            exit 1
          fi
          
          echo "✅ NPM_TOKEN found. Configuring npm..."
          # Force npm to use this token for the registry
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          
          echo "🔍 Verifying authentication..."
          npm whoami
          
          echo "🚀 Publishing..."
          npm publish --access public
name: Publish CLI to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json
      
      - name: Install dependencies
        run: cd packages/cli && npm ci
      
      - name: Build CLI
        run: cd packages/cli && npm run build
      
      - name: Publish to npm
        run: cd packages/cli && npm publish --access public
        env:
          # This uses the short-lived OIDC token generated by setup-node
          NODE_AUTH_TOKEN: ${{ steps.setup-node.outputs.registry-token }}
name: Publish CLI to npm

# Publishing is gated on a GitHub Release, never on a push to main: the release
# tag (v0.1.0, v0.2.0, …) is the version, so a commit cannot reach npm without
# a human deciding it should.
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        run: cd packages/cli && npm ci

      - name: Build CLI
        run: cd packages/cli && npm run build

      - name: Publish to npm
        run: cd packages/cli && npm publish --provenance --access public
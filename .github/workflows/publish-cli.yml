name: Publish CLI to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: cd packages/cli && npm ci
      
      - name: Build CLI
        run: cd packages/cli && npm run build
      
      - name: Debug & Configure npm Auth
        run: |
          echo "--- Checking OIDC Authentication ---"
          npm whoami || echo "OIDC Not Authenticated."
          
          echo "--- Checking for NPM_TOKEN Fallback ---"
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN found. Injecting into ~/.npmrc..."
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
            echo "Verifying fallback auth:"
            npm whoami
          else
            echo "No NPM_TOKEN secret found. Relying entirely on OIDC."
          fi
          
          echo "--- Final .npmrc contents ---"
          cat ~/.npmrc | sed 's/:_authToken=.*/:_authToken=***MASKED***/'

      - name: Publish to npm
        run: cd packages/cli && npm publish --access public
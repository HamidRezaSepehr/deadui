name: Publish CLI to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        run: cd packages/cli && npm ci

      - name: Build CLI
        run: cd packages/cli && npm run build

      - name: Debug npm identity & package
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "=== npm whoami ==="
          npm whoami || true
          echo "=== npm view (package) ==="
          npm view deadui --json || true
          echo "=== npm owner ls (if allowed) ==="
          npm owner ls deadui || true

      - name: Publish to npm
        run: cd packages/cli && npm publish --provenance --access public